---
name: Build container image
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      # Housekeeping of what is already published; cannot change image contents.
      - '.github/workflows/prune-images.yml'
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/prune-images.yml'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  # Runs first and gates the image build: shellcheck takes seconds, while a
  # broken build.sh otherwise only surfaces after a full image build.
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Shellcheck
        run: just lint

  build_push:
    name: Build and push image
    needs: lint
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Runner image ubuntu24/20260726.254 replaced apt's podman 4.9.3 with the
      # podman-static 5.8.4 bundle under /usr/local/bin. That bundle carries its own
      # current crun, but `apt-get install buildah` still pulls Ubuntu noble's crun
      # 1.14.1 into /usr/bin, and podman's default search order tries /usr/bin/crun
      # first. Podman 5 writes `ociVersion: 1.2.x` into the runtime config, while
      # crun only stopped rejecting anything outside 1.0.x in 1.14.3
      # (containers/crun@0860c0ff), so every RUN step died with the unhelpful
      # "unknown version specified".
      #
      # containers.conf.d is the same drop-in mechanism the runner image itself uses
      # for its netavark firewall workaround, so this adds a file instead of editing
      # one. Drop this step once the runner stops leaving a stale crun in /usr/bin.
      #
      # The rollout is gradual, so a run still lands on either image. Only the newer
      # one has a bundled crun to point at; on the older one apt's podman 4.9.3 is
      # paired with a crun that accepts it and there is nothing to fix. So this is a
      # no-op there rather than an error - the earlier version asserted the bundle
      # was present, which failed the build on precisely the runners that were fine.
      - name: Point podman at the crun that shipped with it
        run: |
          set -euo pipefail

          CRUN=/usr/local/bin/crun
          if [[ -x "${CRUN}" ]]; then
            sudo mkdir -p /etc/containers/containers.conf.d
            printf '%s\n' \
              '[engine]' \
              'runtime = "crun"' \
              '' \
              '[engine.runtimes]' \
              "crun = [\"${CRUN}\"]" \
              | sudo tee /etc/containers/containers.conf.d/99-crun-path.conf

            # Assert the drop-in took effect - not that it was needed. Failing here
            # costs seconds; the alternative is the opaque crun error ninety seconds
            # into the build.
            resolved=$(sudo podman info --format '{{.Host.OCIRuntime.Path}}')
            if [[ "${resolved}" != "${CRUN}" ]]; then
              echo "::error::podman still resolves crun to ${resolved}, expected ${CRUN}."
              exit 1
            fi
          else
            echo "No bundled crun at ${CRUN}; leaving podman's runtime resolution alone."
          fi

          # Log both versions either way, so a future mismatch is diagnosable from
          # the log without having to reproduce it.
          sudo podman version --format 'podman {{.Client.Version}}'
          sudo podman info --format 'runtime: {{.Host.OCIRuntime.Path}} {{.Host.OCIRuntime.Version}}' | head -n1

          # Say so when this step has outlived its purpose, rather than leaving it
          # to rot. It exists only because /usr/bin/crun shadows the bundled runtime
          # *and* predates 1.14.3, where the OCI version check was dropped. Once
          # that stops being true the step is dead weight and should be deleted.
          # A warning, not a failure: an obsolete workaround is untidy, not broken.
          stale=""
          if [[ -x /usr/bin/crun ]]; then
            stale=$(/usr/bin/crun --version 2>/dev/null | head -n1 | awk '{print $3}')
          fi
          if [[ -z "${stale}" ]] || [[ "$(printf '%s\n1.14.3\n' "${stale}" | sort -V | head -n1)" == "1.14.3" ]]; then
            echo "::warning::/usr/bin/crun is ${stale:-absent}, so nothing shadows podman's runtime any more - this step can be deleted."
          fi

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          sudo -E $(command -v just) build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # This is optional, this provides smaller delta updates
      #
      # Non-fatal on purpose. Rechunking is a size optimisation, not part of what
      # the image is: an unchunked image still boots and still publishes, it just
      # has fatter deltas. Failing the job over it meant two nightlies in one week
      # produced nothing at all - runs 32567531709 and 32633696364 both hit the
      # same rpm-ostree fault inside the chunker container, with nothing in this
      # repo having changed. That fault is upstream and not yet root-caused (see
      # the long note in the Justfile), so this step is written to degrade instead
      # of taking the whole nightly down with it.
      #
      # The `just` recipe reads and writes the same tag, and podman only moves a
      # tag once the new image is complete, so a failure part-way leaves the
      # pre-rechunk image in place. Checked rather than assumed, because every
      # step after this one pushes whatever that tag points at.
      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          if sudo -E $(command -v just) ostree-rechunk \
               ${IMAGE_NAME} \
               ${DEFAULT_TAG}; then
            echo "rechunked=true" >> $GITHUB_OUTPUT
          else
            echo "rechunked=false" >> $GITHUB_OUTPUT
            echo "::warning::rpm-ostree rechunk failed - publishing the unchunked image. Updates will be larger than usual until this is fixed."
          fi

          if ! sudo podman image exists "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"; then
            echo "::error::localhost/${IMAGE_NAME}:${DEFAULT_TAG} no longer exists after the rechunk step - refusing to publish."
            exit 1
          fi

      # Catch a silent, environment-dependent corruption that shipped in four
      # nightlies (2026-08-30 to 09-02) with every step reporting success.
      #
      # On runner image 20260823.283.1, where podman is the podman-static 5.8.4
      # bundle, committing the build.sh RUN layer dropped the *contents* of every
      # file that already existed in the base image and was modified in place.
      # Files build.sh creates - every binary, dotfile and unit - were written
      # correctly, so the image booted and niri ran. The casualties were the only
      # two base-image files build.sh rewrites:
      #
      #   * /usr/share/rpm/rpmdb.sqlite reverted to the base's copy, so the image
      #     listed 1823 packages instead of 2197. `rpm -q niri` answered "not
      #     installed" on a system running niri, and anything reasoning about the
      #     package set - audits, CVE scanners, rpm-ostree's own upgrade diff - was
      #     reading the wrong list.
      #   * /etc/dnf/repos.override.d/99-config_manager.repo kept the base's 176
      #     bytes of content but took on the new 234-byte length, NUL-padded. dnf5
      #     then aborted on "Missing '=' on line 8" for every invocation, so
      #     package management was dead on arrival for anyone installing those
      #     images.
      #
      # Runs that got podman 4.9.3 are unaffected, so there is no bug in this repo
      # to fix. But the runner image rollout is gradual and has already flipped
      # back and forth once, so the bad podman can return without warning. This
      # step turns "quietly ships a broken image" into "fails the build".
      #
      # It runs after the rechunk on purpose: the rechunk rewrites the image, so
      # the check has to inspect whatever the push step is actually going to
      # publish, not the intermediate.
      - name: Verify the image kept build.sh's in-place changes
        run: |
          set -euo pipefail

          IMAGE="localhost/${IMAGE_NAME}:${DEFAULT_TAG}"

          # Packages only build.sh installs - none ship in the base. A stale
          # rpmdb loses all of them at once, so any one would do; listing five
          # makes the failure output say which layer of the build went missing.
          if ! sudo podman run --rm --entrypoint /usr/bin/rpm "${IMAGE}" \
                 -q niri ghostty brave-origin greetd dms; then
            echo "::error::The image's rpmdb does not list packages build.sh installed - the build.sh layer's rpmdb write was lost. Refusing to publish."
            exit 1
          fi

          # dnf5 refuses to run at all when any repo config fails to parse, so this
          # exercises the real parser instead of pattern-matching the file. repolist
          # is offline and takes milliseconds.
          if ! sudo podman run --rm --entrypoint /usr/bin/dnf5 "${IMAGE}" \
                 repolist >/dev/null; then
            echo "::error::dnf5 cannot parse its own repo configuration inside the image - package management would be broken on every install. Refusing to publish."
            exit 1
          fi

          # A parse check alone would not have caught the 2026-08-30 breakage from
          # the other side: the truncated file's seven surviving lines parsed fine,
          # it was only the NUL padding that tripped dnf5. Assert build.sh's Terra
          # pin actually landed, which is the write that was lost.
          if ! sudo podman run --rm --entrypoint /usr/bin/grep "${IMAGE}" \
                 -q '^\[terra\]' /etc/dnf/repos.override.d/99-config_manager.repo; then
            echo "::error::build.sh's Terra baseurl pin is missing from the image's dnf config - its config-manager write did not survive the layer commit. Refusing to publish."
            exit 1
          fi

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    sudo -E $(command -v just) rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          sudo -E $(command -v just) tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            sudo -E podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${tag} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        # https://github.com/containers/container-libs/issues/388
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

