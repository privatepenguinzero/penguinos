# libvirt runtime state under /var
#
# /var is machine-local on bootc: it is seeded once at install and `bootc
# upgrade` never touches it again. What libvirt's RPMs place under /var during
# the container build therefore does not reach an installed system - of the 16
# directories they declare, 11 were simply absent, and the few that did appear
# carried the build's generic labels (var_lib_t, var_t) instead of the policy's
# virt_* types.
#
# The visible failure: virtnetworkd cannot create /var/lib/libvirt/dnsmasq
# ("Permission denied", an SELinux denial despite running as root), so no
# virtual network starts and every `virsh net-start` fails - which in turn
# fails every VM that asks for one.
#
# systemd-tmpfiles recreates these on each boot with the modes the RPMs declare
# and labels them from the loaded policy. The `z` lines repair a system that
# was installed before this file existed; `d` alone would leave an existing
# directory's wrong label in place.
#
# Deliberately non-recursive. libvirt relabels individual disk images to
# svirt_image_t when a domain starts, so recursing into images/ would undo that
# on every boot.

d /var/lib/libvirt                 0755 root root -
d /var/lib/libvirt/boot            0711 root root -
d /var/lib/libvirt/dnsmasq         0755 root root -
d /var/lib/libvirt/filesystems     0711 root root -
d /var/lib/libvirt/images          0711 root root -
d /var/lib/libvirt/network         0700 root root -
d /var/lib/libvirt/qemu            0751 root root -
d /var/lib/libvirt/qemu/checkpoint 0751 root root -
d /var/lib/libvirt/qemu/dump       0751 root root -
d /var/lib/libvirt/qemu/nvram      0751 root root -
d /var/lib/libvirt/qemu/ram        0751 root root -
d /var/lib/libvirt/qemu/save       0751 root root -
d /var/lib/libvirt/qemu/snapshot   0751 root root -
d /var/lib/libvirt/swtpm           0711 root root -
d /var/cache/libvirt               0711 root root -
d /var/cache/libvirt/qemu          0750 root root -

# Relabel the four that pre-exist mislabelled on systems installed before this
# file shipped. No-ops once the labels are right.
z /var/lib/libvirt                 0755 root root -
z /var/lib/libvirt/images          0711 root root -
z /var/lib/libvirt/qemu            0751 root root -
z /var/cache/libvirt               0711 root root -
